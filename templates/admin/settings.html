{% extends "admin/base_admin.html" %}

{% block header_title %}Store Branding & Information{% endblock %}

{% block admin_content %}
<div class="max-w-4xl mx-auto space-y-6">
    
    {% if success_msg %}
    <div class="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-xs text-emerald-800 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-600"></i>
        <span>{{ success_msg }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/admin/settings/save" class="space-y-6">
        
        <div class="bg-white p-6 sm:p-8 rounded-2xl border border-gray-200 shadow-sm space-y-4 text-xs">
            <h3 class="font-serif text-base font-bold text-gray-900 pb-3 border-b border-gray-100">
                General Boutique Settings
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Brand Name *</label>
                    <input type="text" name="store_name" required value="{{ settings.store_name|default('Shubhashtu Fashion') }}" class="w-full px-3 py-2 border rounded-lg font-bold">
                </div>
                <div>
                    <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Marketing Tagline *</label>
                    <input type="text" name="tagline" required value="{{ settings.tagline|default('Style That Speaks for You.') }}" class="w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div>
                <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Announcement Header Marquee Text</label>
                <input type="text" name="announcement_bar" value="{{ settings.announcement_bar|default('') }}" placeholder="✨ FREE Shipping Across India on Orders Above ₹999 | Use Code WELCOME10 for 10% OFF ✨" class="w-full px-3 py-2 border rounded-lg">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                <div>
                    <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Customer Care Phone</label>
                    <input type="tel" name="support_phone" value="{{ settings.support_phone|default('+91 98765 43210') }}" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">WhatsApp Business Number</label>
                    <input type="text" name="support_whatsapp" value="{{ settings.support_whatsapp|default('919876543210') }}" placeholder="919876543210" class="w-full px-3 py-2 border rounded-lg">
                </div>
                <div>
                    <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Support Email</label>
                    <input type="email" name="support_email" value="{{ settings.support_email|default('care@shubhashtufashion.com') }}" class="w-full px-3 py-2 border rounded-lg">
                </div>
            </div>

            <div>
                <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Physical Boutique / Studio Address</label>
                <textarea name="store_address" rows="2" class="w-full px-3 py-2 border rounded-lg">{{ settings.store_address|default('') }}</textarea>
            </div>

            <div>
                <label class="block font-bold text-gray-800 uppercase tracking-wider mb-1">Instagram Handle</label>
                <input type="text" name="instagram_handle" value="{{ settings.instagram_handle|default('@shubhashtufashion') }}" class="w-full px-3 py-2 border rounded-lg">
            </div>

            <div class="pt-4 flex justify-end">
                <button type="submit" class="btn-luxury-gold px-8 py-2.5 rounded-xl text-xs uppercase tracking-wider font-bold shadow-md">
                    Save Store Information
                </button>
            </div>
        </div>

    </form>

</div>
{% endblock %}
